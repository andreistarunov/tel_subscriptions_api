version: "3.8"
services:
  pg_database:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: subscriptions
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d subscriptions" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - subscription-net


  subscriptions_api:
    container_name: subscriptions_api
    image: subscriptions-backend
    depends_on:
      - pg_database
    environment:
      HOST: postgresql+psycopg2://user:password@pg_database:5432/subscriptions
    networks:
      - subscription-net

networks:
  subscription-net: